services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - stt-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      STT_TRUST_PROXY: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /app/google-service-account.json
    volumes:
      - ./google-service-account.json:/app/google-service-account.json:ro
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Secrets mounted, never baked into the image.
      - ./google-service-account.json:/app/google-service-account.json:ro
      # Accounts must survive `docker compose up --build`.
      - mia-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy provisions the Let's Encrypt cert for this name automatically.
      # Port 80 must stay open — that is how the ACME challenge is answered.
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - stt

volumes:
  stt-redis:
  mia-data:
  caddy-data:
  caddy-config:
